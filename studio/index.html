<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ambient Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans+Condensed:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="studio.css">
</head>
<body>
  <header class="topbar">
    <button class="transport" id="transport" type="button" aria-pressed="false">
      <svg class="transport-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12.5-7.5z"/></svg>
      <svg class="transport-stop" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="1.5"/></svg>
      <span class="transport-label">Play</span>
    </button>
    <input class="mix-title" id="mix-title" type="text" value="Untitled mix" aria-label="Mix name" spellcheck="false">
    <div class="topbar-actions" id="topbar-actions"></div>
  </header>

  <nav class="moods" id="moods" aria-label="Moods"></nav>

  <main class="console" id="console" aria-label="Mixer">
    <div class="strips" id="strips"></div>
    <div class="master-slot" id="master-slot"></div>
  </main>

  <section class="drawer" id="drawer" aria-live="polite"></section>

  <div class="drop-overlay" id="drop-overlay" hidden>
    <p>Drop audio files to add them as tracks</p>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <input type="file" id="file-input" accept="audio/*" multiple hidden>

  <script src="../ambient-mixer.js"></script>
  <script src="../ambient-chords.js"></script>
  <script src="studio.js"></script>
  <script src="studio-effects.js"></script>
  <script src="studio-chords.js"></script>
</body>
</html>
